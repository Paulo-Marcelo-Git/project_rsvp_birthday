<!-- backend/templates/resend_verification.html -->
{% extends "base.html" %}
{% block title %}Comemore+ - Reenviar verificação{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-brand">Comemore+</div>

  <div class="auth-box">
    <h4 class="auth-title">Reenviar verificação</h4>
    <p class="auth-desc">Informe seu email e enviaremos um novo link de verificação.</p>

    <form method="POST" action="{{ url_for('resend_verification') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus
               placeholder="Seu endereço de email">
      </div>
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Reenviar link</button>
      </div>
      <div class="auth-links">
        <a href="{{ url_for('login') }}">← Voltar ao login</a>
      </div>
    </form>
  </div>

  <div class="auth-footer-version">{{ app_version }}</div>
</div>
{% endblock %}
