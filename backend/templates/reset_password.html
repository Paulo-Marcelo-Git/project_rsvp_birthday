<!-- backend/templates/reset_password.html -->
{% extends "base.html" %}
{% block title %}Comemore+ - Redefinir senha{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-brand">Comemore+</div>

  <div class="auth-box">
    <h4 class="auth-title">Nova senha</h4>
    <p class="auth-desc">Escolha uma senha com pelo menos 8 caracteres.</p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Nova senha</label>
        <input type="password" name="new_password" class="form-control"
               required minlength="8" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmar nova senha</label>
        <input type="password" name="confirm_password" class="form-control"
               required minlength="8">
      </div>
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Salvar nova senha</button>
      </div>
      <div class="auth-links">
        <a href="{{ url_for('login') }}">← Voltar ao login</a>
      </div>
    </form>
  </div>

  <div class="auth-footer-version">{{ app_version }}</div>
</div>
{% endblock %}
