<!-- backend/templates/login.html -->

{% extends "base.html" %}
{% block title %}Comemore+ - Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-brand">Comemore+</div>

  <div class="auth-box">
    <h4 class="auth-title">Área do Anfitrião</h4>

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Entrar</button>
      </div>
      <div class="auth-links">
        <a href="{{ url_for('forgot_password') }}">Esqueci minha senha</a>
        &nbsp;·&nbsp;
        <a href="{{ url_for('resend_verification') }}">Reenviar verificação</a>
      </div>
    </form>
  </div>

  <div class="mt-3">
    <a href="{{ url_for('signup') }}" class="btn btn-outline-success btn-sm">
      Criar conta grátis
    </a>
  </div>

  <div class="auth-footer-version">
    {{ app_version }}
  </div>
</div>
{% endblock %}
