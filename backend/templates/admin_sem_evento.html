<!-- backend/templates/admin_sem_evento.html -->
{% extends "base.html" %}
{% block title %}Comemore+ - Admin{% endblock %}

{% block content %}
{% include "_topbar.html" %}

<div class="page-wrapper">
  <div class="content-card text-center py-5">
    <i class="bi bi-calendar-x fs-1 text-muted"></i>
    {% if is_tenant_admin %}
      <h5 class="mt-3">Nenhum evento disponível.</h5>
      <a href="{{ url_for('admin_eventos') }}" class="btn btn-primary mt-2">Criar evento</a>
    {% else %}
      <h5 class="mt-3">Nenhum evento atribuído a você.</h5>
      <p class="text-muted mb-0">Peça ao administrador da conta.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
