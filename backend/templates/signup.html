<!-- backend/templates/signup.html -->
{% extends "base.html" %}
{% block title %}Comemore+ - Criar conta{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-brand">Comemore+</div>

  <div class="auth-box auth-box-wide">
    <h4 class="auth-title">Criar conta</h4>
    <p class="auth-desc">Comece de graça. Crie seu primeiro convite em minutos.</p>

    <form method="POST" action="{{ url_for('signup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label">Seu nome (anfitrião)</label>
        <input type="text" name="nome_anfitriao" class="form-control" required autofocus
               placeholder="Ex.: Maria Silva" minlength="2">
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required
               placeholder="seu@email.com">
      </div>

      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" name="password" class="form-control" required
               minlength="8" placeholder="Mínimo 8 caracteres">
      </div>

      <div class="mb-4">
        <label class="form-label">Confirmar senha</label>
        <input type="password" name="confirm_password" class="form-control" required
               minlength="8" placeholder="Repita a senha">
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" name="accept_terms" id="accept_terms" required>
        <label class="form-check-label small" for="accept_terms">
          Li e aceito os
          <a href="{{ url_for('termos') }}" target="_blank">Termos de Uso</a>
          e a
          <a href="{{ url_for('privacidade') }}" target="_blank">Política de Privacidade</a>.
        </label>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-success">Criar conta</button>
      </div>

      <div class="auth-links">
        <a href="{{ url_for('login') }}">Já tem conta? Faça login</a>
      </div>
    </form>
  </div>

  <div class="auth-footer-version">{{ app_version }}</div>
</div>
{% endblock %}
