<!-- backend/templates/forgot_password.html -->
{% extends "base.html" %}
{% block title %}Comemore+ - Esqueci minha senha{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-brand">Comemore+</div>

  <div class="auth-box">
    <h4 class="auth-title">Esqueci minha senha</h4>
    <p class="auth-desc">Informe seu email e enviaremos um link de redefinição para a sua conta.</p>

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus
               placeholder="Seu endereço de email">
      </div>
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Enviar link</button>
      </div>
      <div class="auth-links">
        <a href="{{ url_for('login') }}">← Voltar ao login</a>
      </div>
    </form>
  </div>

  <div class="auth-footer-version">{{ app_version }}</div>
</div>
{% endblock %}
