{% extends "base.html" %}
{% block title %}Meus Eventos{% endblock %}
{% block content %}
<div class="container py-4">
  <h2>Meus Eventos</h2>
  {% if eventos %}
    <ul>
      {% for e in eventos %}
        <li>{{ e.title }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Nenhum evento encontrado.</p>
  {% endif %}
</div>
{% endblock %}
