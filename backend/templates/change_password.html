<!-- backend/templates/change_password.html -->

{% extends "base.html" %}
{% block title %}Comemore+ - Trocar Senha{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-brand">Comemore+</div>

  <div class="auth-box">
    <h4 class="auth-title">Trocar Senha</h4>
    <p class="auth-desc">Sua senha foi resetada. Escolha uma nova senha para continuar.</p>

    <form method="POST" action="{{ url_for('change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label">Nova senha</label>
        <input type="password" name="new_password" class="form-control"
               required autocomplete="new-password" placeholder="Mínimo 8 caracteres">
      </div>
      <div class="mb-4">
        <label class="form-label">Confirmar nova senha</label>
        <input type="password" name="confirm_password" class="form-control"
               required autocomplete="new-password">
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Salvar Nova Senha</button>
      </div>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('logout') }}">Sair</a>
    </div>
  </div>

  <div class="auth-footer-version">{{ app_version }}</div>
</div>
{% endblock %}
