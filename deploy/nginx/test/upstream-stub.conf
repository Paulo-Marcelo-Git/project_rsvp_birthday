# So para teste: imita o backend Flask em 127.0.0.1:3000 (mesma rede do container).
server {
    listen 127.0.0.1:3000;
    client_max_body_size 60M;
    access_log off;  # so o proxy (mascarado) grava access.log; o stub logaria tokens crus
    default_type text/plain;

    location = / {
        return 200 "xfp=$http_x_forwarded_proto xri=$http_x_real_ip\n";
    }
    location = /login {
        return 200 "xfp=$http_x_forwarded_proto xri=$http_x_real_ip\n";
    }
    location /static/ {
        return 200 "xfp=$http_x_forwarded_proto xri=$http_x_real_ip\n";
    }
    location /invite/ {
        return 404 "nao encontrado\n";
    }
    location / {
        return 200 "xfp=$http_x_forwarded_proto xri=$http_x_real_ip\n";
    }
}
