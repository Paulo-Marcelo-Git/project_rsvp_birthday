# Origem: /etc/nginx/sites-available/zapbyte.com.br na VPS Hostinger (copiada em 2026-10-23, leitura só).
# Fonte de verdade passa a ser este repo; aplicar na VPS no SP2 (não aplicado ainda).
server {
    server_name zapbyte.com.br www.zapbyte.com.br;
    client_max_body_size 55M;
    access_log /var/log/nginx/access.log comemore_masked;
    include /etc/nginx/snippets/comemore-security-headers.conf;

    # Rotas de autenticação: limite estrito por IP
    # (borda direita: /loginX não casa; /login, /login/..., /reset_password/<token> casam)
    location ~ ^/(login|signup|resend-verification|forgot_password)(/|$)|^/reset_password/ {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/snippets/comemore-proxy.conf;
    }

    # Convites (RSVP): add_header aqui anula os herdados, então inclui o snippet de novo
    location ~ ^/invite/ {
        limit_req zone=rsvp burst=60 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/comemore-security-headers.conf;
        include /etc/nginx/snippets/comemore-proxy.conf;
    }

    # Proxy para o backend (Docker/Gunicorn)
    location / {
        limit_req zone=geral burst=40 nodelay;
        include /etc/nginx/snippets/comemore-proxy.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zapbyte.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zapbyte.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.zapbyte.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zapbyte.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    access_log /var/log/nginx/access.log comemore_masked;

    listen 80;
    listen [::]:80;

    server_name zapbyte.com.br www.zapbyte.com.br;
    return 404; # managed by Certbot
}

