# Origem: /etc/nginx/sites-available/zapbyte.com.br na VPS Hostinger (copiada em 2026-10-23, leitura só).
# Fonte de verdade passa a ser este repo; aplicar na VPS no SP2 (não aplicado ainda).
server {
    server_name zapbyte.com.br www.zapbyte.com.br;
    client_max_body_size 55M;
    # Proxy para o backend (Docker/Gunicorn)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120;
        proxy_connect_timeout 30;
        proxy_send_timeout 120;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zapbyte.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zapbyte.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.zapbyte.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zapbyte.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name zapbyte.com.br www.zapbyte.com.br;
    return 404; # managed by Certbot
}

