# Destino na VPS: /etc/nginx/conf.d/comemore.conf (incluído dentro de http pelo nginx.conf do Ubuntu).

# Rate limit por IP (limit_req_zone só é válido no contexto http).
limit_req_status 429;
# Rejeições vão para o error.log com a linha de requisição crua (token); em warn ficam
# abaixo do nível error do error_log de produção e não são gravadas.
limit_req_log_level warn;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rsvp:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=geral:10m rate=10r/s;

# Máscara de tokens no log: o primeiro segmento (no path, antes de "?") após /invite/, /reset_password/ e
# /verify-email/ vira ***, na URL e no Referer; o resto é preservado.
map $request_uri $comemore_uri {
    default $request_uri;
    ~^(?<mu_pre>[^?]*?/(?:invite|reset_password|verify-email)/)[^/?]+(?<mu_pos>.*)$ "${mu_pre}***${mu_pos}";
}

map $http_referer $comemore_referer {
    default $http_referer;
    "" "-";
    ~^(?<mr_pre>[^?]*?/(?:invite|reset_password|verify-email)/)[^/?]+(?<mr_pos>.*)$ "${mr_pre}***${mr_pos}";
}

# Igual ao "combined", mas sem $request (contém a URL crua) e com Referer mascarado.
log_format comemore_masked '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $comemore_uri $server_protocol" $status $body_bytes_sent '
                           '"$comemore_referer" "$http_user_agent"';
